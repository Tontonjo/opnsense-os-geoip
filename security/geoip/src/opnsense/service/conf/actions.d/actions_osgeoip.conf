# actions_osgeoip.conf
# Version: 2.0.0

[update]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/OsGeoip/osgeoip.py update
parameters:
type:script_output
message:Updating GeoIP country lists (IPLocate.io)
description:Update GeoIP country lists (IPLocate.io)

[status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/OsGeoip/osgeoip.py status
parameters:
type:script_output
message:Reading GeoIP plugin statistics

[sync]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/OsGeoip/osgeoip.py sync
parameters:
type:script_output
message:Writing GeoIP source files

[lookup]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/OsGeoip/osgeoip.py lookup
parameters:%s
type:script_output
message:Looking up the country of an address
